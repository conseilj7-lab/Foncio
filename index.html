    </div>
  </div>`;
  document.body.appendChild(m);
}

function saveEditLocataire(lid) {
  const l = DB.logements.find(x => x.id === lid); if (!l) return;
  const loc = l.locataire;
  const motif = (g('el-motif')?.value || '').trim();
  if (!motif) { alert('Le motif de modification est obligatoire.'); return; }
  const nom = (g('el-nom')?.value || '').trim().slice(0, 100);
  if (!nom) { alert('Le nom est obligatoire.'); return; }
  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const heureStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const audit = (l.locataire.audit = l.locataire.audit || []);
  const champs = [
    {key:'nom',    label:'Nom',         newVal:nom},
    {key:'email',  label:'Email',        newVal:(g('el-email')?.value||'').trim().slice(0,200)},
    {key:'tel',    label:'Tél.',         newVal:(g('el-tel')?.value||'').trim().slice(0,30)},
    {key:'entree', label:'Date entrée',  newVal:g('el-entree')?.value||''},
    {key:'garant', label:'Garant',       newVal:(g('el-garant')?.value||'').trim().slice(0,100)},
  ];
  const modifs = champs.filter(c => (loc[c.key]||'') !== (c.newVal||'')).map(c => ({champ:c.key, label:c.label, avant:loc[c.key]||'', apres:c.newVal||''}));
  if (modifs.length === 0) { alert('Aucune modification détectée.'); g('m-edit-loc').remove(); return; }
  const auditEntry = {
    type:'modification', date:dateStr, heure:heureStr,
    desc: motif + ' (' + modifs.map(c=>c.label).join(', ') + ')',
    avant: modifs.map(c=>c.label+': '+(c.avant||'vide')).join(' | '),
    apres: modifs.map(c=>c.label+': '+(c.apres||'vide')).join(' | '),
    modifs: modifs,
    auteur: DB.proprietaire.nom || 'Propriétaire',
  };
  audit.push(auditEntry);
  // Aussi tracer dans l'audit global du logement
  auditLog(lid, 'modification', '👤 Locataire modifié : '+motif+' ('+modifs.map(c=>c.label).join(', ')+')', {motif, modifs});
  modifs.forEach(c => { loc[c.champ] = c.apres; });
  save();
  g('m-edit-loc').remove();
  renderFicheTab(DB.logements.find(x=>x.id===lid), 'locataire');
}

function showAuditComplet(lid) {
  const l = DB.logements.find(x => x.id === lid); if (!l) return;
  // Fusionner audit global du logement + audit locataire (pour rétrocompatibilité)
  const allAudit = [].concat(l.audit||[], l.locataire.audit||[]);
  // Dédupliquer par date+heure+type (les modifs locataire sont aussi dans l.audit maintenant)
  const seen = new Set();
  const audit = allAudit.filter(a=>{
    const k = (a.date||'')+'|'+(a.heure||'')+'|'+(a.type||'')+'|'+(a.desc||'').slice(0,40);
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a,b)=>{
    const da = (a.date||'')+' '+(a.heure||'');
    const db = (b.date||'')+' '+(b.heure||'');
    return db.localeCompare(da);
  });
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'm-audit';
  const auditHTML = audit.length === 0
    ? '<p style="color:var(--tx3);font-size:13px;text-align:center;padding:20px">Aucune modification.</p>'
    : audit.map(a => `
      <div style="border-left:3px solid ${a.type==='création'?'var(--grn)':'var(--acc)'};padding:10px 12px;margin-bottom:8px;background:var(--surf2);border-radius:0 8px 8px 0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
          <div>
            <span style="font-size:10px;font-weight:700;color:${a.type==='création'?'var(--grn)':'var(--acc)'};text-transform:uppercase;letter-spacing:.06em;font-family:monospace">${a.type}</span>
            ${a.auteur?`<span style="font-size:10px;color:var(--tx3);margin-left:6px">· ${e(a.auteur)}</span>`:''}
          </div>
          <span style="font-size:10px;color:var(--tx3);font-family:monospace">${fmtD(a.date)}${a.heure?' '+a.heure:''}</span>
        </div>
        <div style="font-size:13px;color:var(--tx);margin-bottom:4px">${e(a.desc)}</div>
        ${(a.modifs||[]).map(mod=>`
          <div style="font-size:11px;color:var(--tx3);margin-top:3px;padding:3px 8px;background:#fff;border-radius:4px">
            <span style="font-family:monospace;color:var(--acc)">${mod.label||mod.champ}</span>
            <span style="color:var(--red)"> ${e(mod.avant||'vide')}</span>
            <span> →</span>
            <span style="color:var(--grn)"> ${e(mod.apres||'vide')}</span>
          </div>`).join('')}
      </div>`).join('');
  m.innerHTML = `<div class="modal-box">
    <div class="mhdr">
      <span class="mtitle">📋 Piste d'audit — ${e(l.locataire.nom)}</span>
      <button class="mclose" onclick="g('m-audit').remove()">×</button>
    </div>
    <div style="background:var(--surf2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--tx2)">
      ${audit.length} événement${audit.length>1?'s':''} tracé${audit.length>1?'s':''} · ${e(l.nom)}
    </div>
    <div style="max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch">${auditHTML}</div>
    <button class="btn bp bfull" style="margin-top:12px" onclick="g('m-audit').remove()">Fermer</button>
  </div>`;
  document.body.appendChild(m);
}

      ${sig.typeBailLabel?`<div class="dlrow"><span class="dlk">Type</span><span class="dlv">${e(sig.typeBailLabel)}</span></div>`:''}
      <div class="dlrow"><span class="dlk">Date</span><span class="dlv">${fmtD(sig.date)}</span></div>
      <div class="dlrow"><span class="dlk">Locataire</span><span class="dlv">${e(l.locataire.nom)}</span></div>

    content=`${al('w','Le bail n\'a pas encore été signé électroniquement.')}
    <div class="card" style="margin-top:10px;margin-bottom:10px">
      <div class="sect">Récapitulatif bail</div>
      <div class="dlrow"><span class="dlk">Logement</span><span class="dlv">${e(l.nom)}</span></div>
      <div class="dlrow"><span class="dlk">Locataire</span><span class="dlv">${e(l.locataire.nom)}</span></div>
      <div class="dlrow"><span class="dlk">Loyer HC</span><span class="dlv">${l.bail.loyer} €/mois</span></div>
      <div class="dlrow"><span class="dlk">Exigible le</span><span class="dlv">${(l.bail.jourPaiement||1)+(l.bail.jourPaiement===1?'<sup>er</sup>':' ème')+' du mois'}</span></div>
      <div class="dlrow"><span class="dlk">Charges</span><span class="dlv">${l.bail.charges} €/mois</span></div>
      <div class="dlrow"><span class="dlk">Dépôt</span><span class="dlv">${l.bail.depot} €</span></div>

    </div>
    <div class="card bl-a" style="margin-bottom:10px">
      <div class="sect">Zone de signature bailleur</div>
      <p style="font-size:13px;color:var(--tx2);margin-bottom:10px">En signant, vous certifiez les informations ci-dessus exactes et vous engagez aux termes du bail.</p>
      <div style="border:2px solid var(--brd);border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--surf2)" id="sig-zone">

      </div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;cursor:pointer;line-height:1.5">
        <input type="checkbox" id="sig-consent" style="margin-top:2px;flex-shrink:0"/>

    </div>

function signerBail(lid){
  if(!g('sig-consent')?.checked){alert('Veuillez cocher la case de consentement pour signer.');return;}
  const l=DB.logements.find(x=>x.id===lid); if(!l)return;
  l.signatureBail={requis:true, signee:true, date:new Date().toISOString().slice(0,10), migre:false};
  save();
  g('m-sign').remove();
  // Propose email au locataire
  const body='Madame, Monsieur '+l.locataire.nom+',\n\nVotre bail pour le logement situé '+l.adresse+' a été signé électroniquement par le bailleur '+DB.proprietaire.nom+' en date du '+new Date().toLocaleDateString('fr-FR')+'.\n\nConditions :\n- Loyer HC : '+l.bail.loyer+' €/mois\n- Charges : '+l.bail.charges+' €/mois\n- Dépôt de garantie : '+l.bail.depot+' €\n- Prise d\'effet : '+fmtD(l.bail.debut)+'\n\nCordialement,\n'+DB.proprietaire.nom;
  modalEmail({to:l.locataire.email, subject:'Bail signé — '+l.adresse, body, title:'Envoyer copie au locataire'});
}

function envSignature(lid){
  const l=DB.logements.find(x=>x.id===lid); if(!l)return;
  const body='Madame, Monsieur '+l.locataire.nom+',\n\nVeuillez trouver ci-joint votre copie du bail signé pour '+l.adresse+'.\n\nCordialement,\n'+DB.proprietaire.nom;
  modalEmail({to:l.locataire.email, subject:'Copie bail signé — '+l.adresse, body, title:'Renvoyer copie bail'});
}

// ── EXPORT / IMPORT DONNÉES (mise à jour sans perte) ─────────────────────────
function exporterDonnees() {
  const exportData = Object.assign({}, DB, {
    _export: { date: new Date().toISOString(), version: 'foncio_v1', logements: DB.logements.length }
  });
  const data = JSON.stringify(exportData, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'foncio_sauvegarde_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Sauvegarde téléchargée ! Conservez ce fichier précieusement.', 5000);
}

function importerDonnees() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.logements || !Array.isArray(data.logements)) throw new Error('Format invalide');
        if (confirm('Restaurer les données depuis ce fichier ? Vos données actuelles seront remplacées.')) {
          DB = data;
          save();
          renderTableau();
          showToast('✅ Données restaurées avec succès !', 4000);
        }
      } catch(err) {
        alert('Fichier invalide : ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function showHistoriqueDetteLocataire(lid) {

  const partiels = (l.paiements||[]).filter(p=>p.statut==='partiel'||p.dette>0);
  const impayes  = (l.paiements||[]).filter(p=>p.statut==='impayé');

  const m = document.createElement('div'); m.className='modal-bg'; m.id='m-histo-dette';
  const lignesH = [...partiels,...impayes].sort((a,b)=>b.mois.localeCompare(a.mois)).map(p=>{
    const d = p.dette || (p.montantAttendu?(p.montantAttendu-(p.montantEncaisse||0)):((p.montant||0)+(p.charges||0)));

        <div style="text-align:right">
          <div style="font-family:monospace;font-weight:700;font-size:15px;color:var(--red)">-${fmt(d)} €</div>
          ${tag(p.statut==='partiel'?'Partiel':'Impayé',p.statut==='partiel'?'var(--org)':'var(--red)')}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn bs bsm" onclick="showEncaisser(${l.id},${p.id})">💶 Compléter paiement</button>
        <button class="btn bs bsm" onclick="envRelanceDette(${l.id},${p.id})">📧 Mise en demeure</button>

function validerComplement(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  const mt = parseFloat(g('compl-mt')?.value||0);
  if(!mt||mt<=0){alert('Montant invalide.');return;}
  const typeOp = v('compl-top')||'locataire';
  const dateCompl = v('compl-date')||new Date().toISOString().slice(0,10);

  // Ajouter la ligne de complément aux lignes existantes
  p.lignes = p.lignes||[];
  p.lignes.push({rubrique:'loyer', typeOp, montant:mt, desc:'Complément '+(new Date(dateCompl)).toLocaleDateString('fr-FR')});

  const newTotal = (p.montantEncaisse||0) + mt;
  const ecart = newTotal - (p.montantAttendu||newTotal);

  p.montantEncaisse = newTotal;
  p.dette = Math.max(0, -ecart);
  p.tropPercu = Math.max(0, ecart);
  p.statut = p.dette < 0.01 ? 'payé' : 'partiel';
  p.date = dateCompl;

  // Audit : complément
  auditLog(lid, 'paiement',
    '💶 Complément de '+fmt(mt)+' € — '+moisLbl(p.mois)+(p.statut==='payé'?' (DETTE SOLDÉE)':' (reste '+fmt(p.dette)+' €)'),
    {mois:p.mois, complement:mt, nouveauTotal:newTotal, statut:p.statut}
  );
  save(); g('m-compl').remove();

  if(p.statut === 'payé') {
    showToast('✅ Dette soldée — paiement complet !', 4000);
    renderLoyers();
    setTimeout(()=>{
      if(confirm('Paiement complet ! Envoyer la quittance au locataire ?')) envQuitt(lid,pid);
    }, 300);
  } else {
    showToast('💶 Complément enregistré — reste '+fmt(p.dette)+' € de dette', 4000);
    renderLoyers();
  }
}

function reencaisser(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  // Snapshot de l'état actuel (pas de mutation du statut)
  window._encBackup = {
    lid, pid,
    backup: {
      statut:p.statut, montant:p.montant, charges:p.charges,
      lignes:JSON.parse(JSON.stringify(p.lignes||[])),
      montantAttendu:p.montantAttendu, montantEncaisse:p.montantEncaisse,
      dette:p.dette, tropPercu:p.tropPercu, date:p.date
    }
  };
  // Ouvrir showEncaisser en mode correction (statut forcé 'appel' uniquement dans la modal)
  p._modeCorrection = true;
  const statOriginal = p.statut;
  p.statut = 'appel';
  showEncaisser(lid, pid);
  // Bouton annuler → restaure l'état original
  const modal = document.getElementById('m-enc');
  if(modal){
    const closeBtn = modal.querySelector('.mclose');
    const cancelBtn = modal.querySelector('#enc-cancel-btn');
    function restaurer(){
      const bk = window._encBackup;
      if(bk && bk.pid===pid){
        const ll=DB.logements.find(x=>x.id===bk.lid);
        const pp=(ll&&ll.paiements||[]).find(x=>x.id===bk.pid);
        if(pp){ Object.assign(pp, bk.backup); delete pp._modeCorrection; }
        delete window._encBackup;
      }
      const m=document.getElementById('m-enc'); if(m)m.remove();
      renderLoyers();
    }
    if(closeBtn){ closeBtn.onclick = restaurer; closeBtn.ontouchend = (ev)=>{ ev.preventDefault(); restaurer(); }; }
    if(cancelBtn){ cancelBtn.onclick = restaurer; cancelBtn.ontouchend = (ev)=>{ ev.preventDefault(); restaurer(); }; }
  }
}

function annulerEncaissement(lid, pid) {
  if(!confirm('Annuler cet encaissement et remettre le mois en impaye ?')) return;
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  p.statut = 'impayé';
  p.date = null;
  p.quittance = false;
  p.dette = 0;
  p.tropPercu = 0;
  p.montantEncaisse = 0;
  p.montantAttendu = 0;
  delete p._backup;
  // Garder les lignes de l'appel (rubrique/montants attendus)
  if(p.lignes && p.lignes.length) {
    // Remettre aux montants attendus
    p.lignes.forEach(li => { if(li._montantAttendu) li.montant = li._montantAttendu; });
  }
  // Audit : annulation
  auditLog(lid, 'paiement',
    '↩️ Annulation encaissement — '+moisLbl(p.mois),
    {mois:p.mois}
  );
  save();
  showToast('↩️ Encaissement annulé — mois remis en impayé', 3500);
  renderLoyers();
}


function majBilanComplement(val, dette, enc, attendu) {
  var mt=parseFloat(val)||0;
  var newTotal=enc+mt, ecart=newTotal-attendu;
  var bilan=document.getElementById('compl-bilan'); if(!bilan)return;
  if(Math.abs(ecart)<0.01) bilan.innerHTML='<span style="color:#4ade80">✓ Paiement complet — dette soldée</span>';
  else if(ecart<0) bilan.innerHTML='<span style="color:#fca5a5">Reste encore '+(attendu-newTotal).toFixed(2)+' € de dette</span>';
  else bilan.innerHTML='<span style="color:#4ade80">Trop-perçu de '+ecart.toFixed(2)+' €</span>';
}

function showSignatureCanvas(lid, typeDoc, titre, onSigned) {
  const l = DB.logements.find(x=>x.id===lid); if(!l)return;
  const m = document.createElement('div'); m.className='modal-bg'; m.id='m-sigcanvas';
  m.innerHTML = `<div class="modal-box" style="padding:16px">
    <div class="mhdr">
      <span class="mtitle">✍️ ${e(titre||'Signature')}</span>
      <button class="mclose" onclick="g('m-sigcanvas').remove()">×</button>
    </div>

    <div class="al al-i"><span class="al-ic">📱</span><div>
      <strong>Signez au doigt</strong> dans le cadre ci-dessous. La signature sera enregistrée sur cet appareil.
    </div></div>

    <div style="position:relative;margin:12px 0;border:2px solid var(--brd2);border-radius:8px;background:#f8fafc;overflow:hidden">
      <canvas id="sig-canvas" width="440" height="180"
        style="width:100%;height:180px;display:block;touch-action:none;cursor:crosshair"></canvas>
      <div id="sig-placeholder" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--tx3);font-size:13px;gap:8px">
        <span style="font-size:28px">✍️</span> Signez ici au doigt
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn bs bsm" onclick="effacerSignature()">🗑 Effacer</button>
      <span style="flex:1;font-size:11px;color:var(--tx3);display:flex;align-items:center">
        Signez lentement pour plus de précision
      </span>
    </div>

    <div class="ff">
      <label class="lbl">Nom du signataire</label>
      <input type="text" class="inp" id="sig-signataire" value="${e(l.locataire.nom)}" />
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn bs" onclick="g('m-sigcanvas').remove()">Annuler</button>
      <button class="btn bp" style="flex:1" onclick="validerSignatureCanvas(${lid},'${typeDoc}')">
        ✓ Valider la signature
      </button>
    </div>
  </div>`;
  document.body.appendChild(m);

  // ── Initialiser le canvas ────────────────────────────────────────────────
  setTimeout(function(){
    const canvas = document.getElementById('sig-canvas'); if(!canvas)return;
    const ctx = canvas.getContext('2d');
    // Résolution réelle du canvas (retina)
    const dpr = window.devicePixelRatio||1;
    canvas.width  = canvas.offsetWidth  * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.scale(dpr,dpr);
    ctx.strokeStyle = '#0f2044';
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';

    let drawing = false, hasSig = false;
    let lastX=0, lastY=0;

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return {x: (src.clientX - rect.left), y: (src.clientY - rect.top)};
    }
    function start(e){ e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x;lastY=p.y; }
    function draw(e){
      if(!drawing)return; e.preventDefault();
      const p=getPos(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y;
      if(!hasSig){ hasSig=true; const ph=document.getElementById('sig-placeholder'); if(ph)ph.style.display='none'; }
      canvas._hasSig=true;
    }
    function stop(e){ e.preventDefault(); drawing=false; }

    canvas.addEventListener('mousedown',  start);
    canvas.addEventListener('mousemove',  draw);
    canvas.addEventListener('mouseup',    stop);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove',  draw,  {passive:false});
    canvas.addEventListener('touchend',   stop,  {passive:false});

    // Stocker le callback
    window._sigOnSigned = onSigned||null;
  }, 50);
}

function effacerSignature(){
  const canvas = document.getElementById('sig-canvas'); if(!canvas)return;
  try {
    const ctx = canvas.getContext('2d');
    if(ctx) ctx.clearRect(0,0,canvas.width,canvas.height);
  } catch(ex){}
  canvas._hasSig = false;
  const ph = document.getElementById('sig-placeholder'); if(ph)ph.style.display='';
}

function validerSignatureCanvas(lid, typeDoc){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas || !canvas._hasSig){ alert('Veuillez signer dans le cadre.'); return; }
  const signataire = (document.getElementById('sig-signataire')?.value||'').trim() || DB.logements.find(x=>x.id===lid)?.locataire.nom || '';
  const dataUrl = canvas.toDataURL('image/png');
  const dateStr = new Date().toISOString().slice(0,10);
  const l = DB.logements.find(x=>x.id===lid); if(!l)return;

  if(typeDoc==='bail'){
    l.signatureBail = l.signatureBail||{};
    l.signatureBail.signee   = true;
    l.signatureBail.date     = dateStr;
    l.signatureBail.signataire = signataire;
    l.signatureBail.dataUrl  = dataUrl;
    l.signatureBail.migre    = false;
    l.signatureBail.requis   = false;
    auditLog(lid,'bail','✍️ Bail signé électroniquement par '+signataire,{date:dateStr});
    showToast('✅ Bail signé !');
  } else {
    // Signature EDL ou autre
    const docIdx = (l.docs||[]).findIndex(d=>d.type===typeDoc);
    const sigDoc = {id:Date.now(), nom:'Signature '+DOC_LBL[typeDoc], type:typeDoc+'_sig', date:dateStr, signataire, dataUrl};
    if(docIdx>=0){ l.docs[docIdx].signatureUrl=dataUrl; l.docs[docIdx].signee=true; l.docs[docIdx].signeeDate=dateStr; }
    else (l.docs=l.docs||[]).push(sigDoc);
    auditLog(lid,'document','✍️ Document signé : '+DOC_LBL[typeDoc]+' par '+signataire,{date:dateStr});
    showToast('✅ Document signé !');
  }

  save();
  g('m-sigcanvas').remove();
  if(typeof window._sigOnSigned==='function'){ window._sigOnSigned(dataUrl); window._sigOnSigned=null; }
  renderFicheTab(l, typeDoc==='bail'?'locataire':'conformité');
}

  const hasAssur  = (l.docs||[]).some(d=>d.type==='assurance');

    {ok:hasAssur,  icon:'🛡',titre:'Attestation assurance','desc':'Obtenir l\'attestation du locataire',      action:()=>{g('m-onboarding').remove();showGererAssurance(lid);}},
    {ok:false,     icon:'📧',titre:'Email de bienvenue', desc:'Envoyer un récap au locataire',               action:()=>{g('m-onboarding').remove();emailBienvenue(lid);}},
  ];
  const done = steps.filter(s=>s.ok).length;
  const pct  = Math.round(done/steps.length*100);

  const stepsH = steps.map((s,i)=>{

      +'<div style="font-size:11px;color:var(--tx3);margin-top:2px">'+s.desc+'</div></div>'
      +(s.ok
        ?'<span style="font-size:22px">✅</span>'
        :'<button class="btn bp bsm" data-step="'+i+'" id="ob-step-'+i+'">Démarrer</button>'
      )+'</div>';
  }).join('');

  const m = document.createElement('div'); m.className='modal-bg'; m.id='m-onboarding';
  m.innerHTML = `<div class="modal-box">
    <div class="mhdr">
      <span class="mtitle">🏠 Mise en location — ${e(l.nom)}</span>
      <button class="mclose" onclick="g('m-onboarding').remove()">×</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div>
        <div style="font-size:22px;font-weight:700;color:${pctColor}">${pct}% complété</div>
        <div style="font-size:11px;color:var(--tx3)">${done}/${steps.length} étapes</div>
      </div>
      ${pct===100?'<div style="font-size:32px">🎉</div>':''}
    </div>
    <div style="height:6px;background:var(--brd);border-radius:3px;overflow:hidden;margin-bottom:16px">
      <div style="width:${pct}%;height:100%;background:${pctColor};border-radius:3px;transition:width .4s"></div>
    </div>

    ${done===steps.length
      ?'<div class="al al-s"><span class="al-ic">🎉</span><div><strong>Logement prêt !</strong> Toutes les étapes sont complétées. Le dossier locatif est conforme.</div></div>'
      :''}

    <div>${stepsH}</div>

    <button class="btn bs bfull" style="margin-top:16px" onclick="g('m-onboarding').remove()">Fermer</button>

  document.body.appendChild(m);

  steps.forEach(function(s, i){
    var btn = document.getElementById('ob-step-'+i);
    if(btn) btn.onclick = s.action;
  });
}

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center">
        <div><div style="font-size:11px;color:#7d92b0">Loyer HC/mois</div><div style="font-size:20px;font-weight:700;color:#1e4fa0">${fmt(loyer)} €</div></div>
        <div><div style="font-size:11px;color:#7d92b0">Charges/mois</div><div style="font-size:20px;font-weight:700;color:#1a6e45">${fmt(charges)} €</div></div>
        <div><div style="font-size:11px;color:#7d92b0">Total CC/mois</div><div style="font-size:20px;font-weight:700">${fmt(loyer+charges)} €</div></div>
      </div>
    </div>
    <p>Le loyer est payable mensuellement, le <strong>${params&&params.jourPaiement?params.jourPaiement+(params.jourPaiement===1?'<sup>er</sup>':'<sup>ème</sup>'):'1<sup>er</sup>'} de chaque mois</strong>, par virement bancaire ou tout autre moyen agréé par le bailleur. Le loyer pourra être révisé chaque année à la date anniversaire du bail en fonction de la variation de l'Indice de Référence des Loyers (IRL) publié par l'INSEE.</p>
    ${charges>0?`<p>Les charges sont payables sous forme de <strong>provisions mensuelles</strong> de ${fmt(charges)} €, avec régularisation annuelle sur justificatifs.</p>`:''}
    ${l.bail.encadrement?`<p><strong>Encadrement des loyers :</strong> Ce logement est situé en zone d'encadrement des loyers. Le loyer de base est de ${fmt(loyer)} €/m²/mois, conforme au loyer de référence majoré applicable.</p>`:''}

    <!-- DÉPÔT -->
    ${typeBail!=='mobilite'?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article 5 — Dépôt de garantie</h2>
    <p>À la signature du présent bail, le locataire verse au bailleur un dépôt de garantie de <strong>${fmt(depot)} €</strong> (${depot===loyer?'1 mois de loyer hors charges':depot===2*loyer?'2 mois de loyer hors charges':'montant convenu'}).</p>
    <p>Ce dépôt sera restitué dans un délai maximum d'<strong>un mois</strong> après remise des clés si l\'état des lieux de sortie est conforme à l\'état des lieux d'entrée, ou de <strong>deux mois</strong> en cas de dégradations constatées, déduction faite des sommes dues.</p>
    `:'<p style="color:#7d92b0;font-style:italic">Bail mobilité : aucun dépôt de garantie ne peut être demandé au locataire.</p>'}

    <!-- OBLIGATIONS LOCATAIRE -->
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article 6 — Obligations du locataire</h2>
    <ul style="padding-left:18px;margin:0">
      <li>Payer le loyer et les charges aux termes convenus</li>
      <li>User paisiblement des locaux conformément à leur destination</li>
      <li>Répondre des dégradations et pertes survenant pendant la durée du bail</li>
      <li>Prendre à sa charge l'entretien courant du logement et les menues réparations</li>
      <li>Ne pas transformer les locaux sans accord écrit du bailleur</li>
      <li>Laisser exécuter les travaux urgents</li>
      <li><strong>Souscrire une assurance multirisque habitation</strong> et en justifier chaque année (art. 7g)</li>
      <li>Ne pas céder le bail ni sous-louer sans autorisation écrite du bailleur</li>
      ${hasAnimaux?'':'<li>Ne pas détenir d\'animaux dangereux de 1ère et 2ème catégorie</li>'}
    </ul>

    <!-- OBLIGATIONS BAILLEUR -->
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article 7 — Obligations du bailleur</h2>
    <ul style="padding-left:18px;margin:0">
      <li>Délivrer un logement décent, en bon état d'usage et de réparation</li>
      <li>Assurer la jouissance paisible des lieux</li>
      <li>Entretenir les locaux en état de servir</li>
      <li>Effectuer les réparations autres que locatives</li>
      <li>Remettre les documents annexes obligatoires (DPE, diagnostics, notice)</li>
    </ul>

    <!-- RÉSILIATION -->
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article 8 — Résiliation — Congé</h2>
    ${typeBail==='mobilite'||typeBail==='saisonniere'?
      '<p>Le contrat prend fin de plein droit à l\'échéance prévue, sans qu\'il soit besoin de donner congé.</p>':
      `<p><strong>Congé du locataire :</strong> ${tb.preavis_locataire} mois de préavis par lettre recommandée ou acte d\'huissier. Le délai de préavis est réduit à 1 mois dans les zones tendues ou en cas de perte d'emploi, mutation, raisons de santé.</p>
      <p><strong>Congé du bailleur :</strong> ${tb.preavis_bailleur} mois de préavis avant l'échéance du bail, uniquement pour reprise personnelle, vente ou motif légitime et sérieux.</p>`
    }

    <!-- CLAUSE RÉSOLUTOIRE -->
    ${params&&params.clauseResolutoire?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article 9 — Clause résolutoire</h2>
    <p>En application de l'article 24 de la loi du 6 juillet 1989, le bail sera résilié de plein droit, après acte d'huissier de justice constatant la non-exécution de l'obligation, en cas de :</p>
    <ul style="padding-left:18px;margin:8px 0">
      <li>Non-paiement du loyer ou des charges aux termes convenus</li>
      <li>Non-versement du dépôt de garantie</li>
      <li>Défaut d'assurance habitation</li>
      <li>Troubles de voisinage constatés par décision de justice</li>
    </ul>
    <p style="font-size:12px;color:#475569">La résiliation ne sera acquise qu'à l'expiration d'un délai de deux mois à compter du commandement de payer, resté infructueux.</p>`:''}

    <!-- CLAUSE DE SOLIDARITÉ -->
    ${params&&params.solidarite?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article ${params.clauseResolutoire?10:9} — Solidarité entre locataires</h2>
    <p>Les locataires ci-après : <strong>${params.multiLocataires?e(params.multiLocataires):e(l.locataire.nom)}</strong>, sont tenus solidairement et indivisiblement de toutes les obligations découlant du présent bail. Le bailleur pourra exiger de l'un quelconque d'entre eux l'exécution de la totalité des obligations communes.</p>
    ${params&&params.indivisibilite?'<p>Le présent bail est <strong>indivisible</strong> entre les preneurs. Tout congé, toute demande de renouvellement, toute demande de résiliation ne peuvent émaner et être opposés qu\'à l\'ensemble des locataires.</p>':''}`:''}

    <!-- CHARGES RÉCUPÉRABLES -->
    ${params&&params.chargesRecuperables?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Charges récupérables (Décret n° 87-713)</h2>
    <p style="font-size:12px;color:#475569">Les charges locatives récupérables comprennent notamment :</p>
    <ul style="padding-left:18px;margin:6px 0;font-size:12px;color:#475569">
      <li>Dépenses relatives aux ascenseurs et monte-charge</li>
      <li>Eau froide, eau chaude et chauffage collectif</li>
      <li>Installations individuelles (eau froide, eau chaude, chauffage)</li>
      <li>Parties communes intérieures (entretien, menues réparations)</li>
      <li>Espaces extérieurs (entretien, équipements)</li>
      <li>Hygiène (désinfection, désinsectisation)</li>
      <li>Équipements divers (antenne collective, interphone, VMC)</li>
      <li>Taxes (ordures ménagères, assainissement, balayage)</li>
    </ul>`:''}

    <!-- NOTICE D'INFORMATION -->
    ${params&&params.noticeRemise?`
    <div style="background:#f0f4f8;border-radius:8px;padding:12px;margin-top:16px;font-size:12px;color:#475569">
      ✅ <strong>Notice d'information locataire :</strong> Le locataire reconnaît avoir reçu, à la date de signature du présent bail, la notice d'information relative aux droits et obligations des locataires et des bailleurs (Décret n° 2015-587 du 29 mai 2015 modifié).
    </div>`:''}

    <!-- CLAUSES PARTICULIÈRES -->
    ${clauseParticuliere?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Clause particulière</h2>
    <p>${e(clauseParticuliere).replace(/\n/g,'<br>')}</p>`:''}

    <!-- GARANT -->
    ${hasGarant?`
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Article ${clauseParticuliere?10:9} — Cautionnement</h2>
    <p>Le présent bail est garanti par la caution solidaire de <strong>${e(l.locataire.garant)}</strong>, qui s\'engage à répondre solidairement avec le locataire de toutes les sommes dont celui-ci serait redevable.</p>`:''}

    <!-- ÉLECTION DE DOMICILE -->
    <h2 style="font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3d5075;border-bottom:2px solid #d6dce8;padding-bottom:8px;margin-top:20px;margin-bottom:14px">Élection de domicile</h2>
    <p>Pour l'exécution des présentes, les parties font élection de domicile en leur demeure respective telle qu'indiquée ci-dessus.</p>

    <!-- MENTIONS LÉGALES -->
    <div style="background:#f0f4f8;border-radius:8px;padding:14px;margin-top:20px;font-size:11px;color:#7d92b0">
      <strong>Mentions légales :</strong> Ce contrat est soumis aux dispositions de la ${tb.loi}. Les parties reconnaissent avoir reçu la notice d\'information relative aux droits et obligations des locataires et bailleurs (Décret n° 2015-587 du 29 mai 2015). En cas de litige, les parties s\'engagent à privilégier la conciliation avant toute action en justice.
    </div>

    <!-- ZONE DE SIGNATURE -->
    <div id="bail-signatures" style="margin-top:28px">
      <div style="text-align:center;font-size:12px;color:#7d92b0;margin-bottom:16px">
        Fait à <strong>${e(prop.adresse ? prop.adresse.split(',').pop().trim() : '___')}</strong>, le <strong>${today}</strong>, en deux exemplaires originaux.
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7d92b0;margin-bottom:10px;text-align:center">Bailleur</div>
          <div style="font-weight:700;text-align:center;margin-bottom:8px">${e(prop.nom||'—')}</div>
          <div style="border:2px dashed #b8c4d8;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;background:#f8fafc" id="sig-bailleur-zone"><span style="font-size:11px;color:#b8c4d8">Signature</span></div>
          <div style="font-size:10px;color:#b8c4d8;text-align:center;margin-top:4px">Lu et approuvé</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7d92b0;margin-bottom:10px;text-align:center">Locataire</div>
          <div style="font-weight:700;text-align:center;margin-bottom:8px">${e(l.locataire.nom||'—')}</div>
          <div style="border:2px dashed #b8c4d8;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;background:#f8fafc" id="sig-locataire-zone"><span style="font-size:11px;color:#b8c4d8">Signature</span></div>
          <div style="font-size:10px;color:#b8c4d8;text-align:center;margin-top:4px">Lu et approuvé</div>
        </div>
      </div>
    </div>

  </div>
</div>`;
}


// ── WIZARD BAIL — Point d'entrée ───────────────────────────────────────────────
function showWizardBail(lid) {
  const l = DB.logements.find(x=>x.id===lid); if(!l)return;
  // Réinitialiser l'état du wizard
  window._wbState = {
    lid, step:1, typeBail:null,
    params:{
      animaux:false,
      clauseParticuliere:'',
      solidarite:false,
      clauseResolutoire:true,   // clause résolutoire active par défaut
      indivisibilite:false,
      jourPaiement:1,           // jour de paiement du loyer (1-28)
      multiLocataires:'',       // noms des co-locataires si solidarité
      chargesRecuperables:true, // liste des charges récupérables
      noticeRemise:true,        // notice d'information remise
    },
    sigBailleur:null, sigLocataire:null, scrolledEnough:false
  };
  renderWizardBailStep(1);
}

// ── Étape 1 : Choix du type de bail ───────────────────────────────────────────
function renderWizardBailStep(step) {
  var st = window._wbState;
  var l = DB.logements.find(x=>x.id===st.lid); if(!l)return;

  // Nettoyer la modal précédente
  var old = document.getElementById('m-wbail');
  if(old) old.remove();

  var m = document.createElement('div');
  m.className = 'modal-bg'; m.id = 'm-wbail';

  var content = '';
  var title = '';

  // ── Étape 1 : Type de bail ─────────────────────────────────────────────────
  if(step===1){
    title = '📝 Type de bail';
    var types = TYPES_BAIL.map(function(t){
      var sel = st.typeBail===t.id;
      return '<div id="wb-type-'+t.id+'" data-type="'+t.id+'" style="border:2px solid '+(sel?t.color:'var(--brd)')+';border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;background:'+(sel?t.color+'10':'var(--surf2)')+';transition:border .2s">'
        +'<div style="display:flex;align-items:flex-start;gap:12px">'
        +'<span style="font-size:28px;flex-shrink:0">'+t.icon+'</span>'
        +'<div style="flex:1">'
        +'<div style="font-weight:700;font-size:14px;color:'+t.color+'">'+t.label+'</div>'
        +'<div style="font-size:11px;color:var(--tx3);margin-top:2px">'+t.duree+'</div>'
        +'<div style="font-size:12px;color:var(--tx2);margin-top:6px;line-height:1.5">'+t.desc+'</div>'
        +'</div>'
        +(sel?'<span style="font-size:20px">✅</span>':'')
        +'</div></div>';
    }).join('');
    content = '<div class="sect">Choisissez le type de contrat</div>'
      + types
      + '<div class="al al-i"><span class="al-ic">ℹ️</span><div>Dès la sélection, le bail sera généré automatiquement avec les mentions légales obligatoires.</div></div>';
  }

  // ── Étape 2 : Informations complémentaires ─────────────────────────────────
  else if(step===2){
    title = '📋 Informations du bail';
    var tb = TYPES_BAIL.find(t=>t.id===st.typeBail)||TYPES_BAIL[0];
    content = '<div class="al al-s"><span class="al-ic">'+tb.icon+'</span><div><strong>'+tb.label+'</strong><br><span style="font-size:11px">'+tb.loi+'</span></div></div>'
      + '<div class="sect" style="margin-top:12px">Vérification des données</div>'
      + '<div class="card">'
      + '<div class="dlrow"><span class="dlk">Logement</span><span class="dlv">'+e(l.adresse)+'</span></div>'
      + '<div class="dlrow"><span class="dlk">Locataire</span><span class="dlv">'+e(l.locataire.nom)+'</span></div>'
      + '<div class="dlrow"><span class="dlk">Loyer HC</span><span class="dlv">'+fmt(l.bail.loyer)+' €/mois</span></div>'
      + '<div class="dlrow"><span class="dlk">Charges</span><span class="dlv">'+fmt(l.bail.charges)+' €/mois</span></div>'
      + (tb.depot?'<div class="dlrow"><span class="dlk">Dépôt de garantie</span><span class="dlv">'+fmt(l.bail.depot)+' €</span></div>':'<div class="dlrow"><span class="dlk">Dépôt</span><span class="dlv" style="color:var(--org)">Aucun (bail mobilité)</span></div>')
      + '<div class="dlrow" style="border:none"><span class="dlk">Début</span><span class="dlv">'+fmtD(l.bail.debut)+'</span></div>'
      + '</div>'
      + '<div class="sect" style="margin-top:12px">Clauses optionnelles</div>'
      + '<div class="card">'
      + '<div class="ff"><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-animaux"'+(st.params.animaux?' checked':'')+'/> <span><strong>Animaux</strong> — animaux de compagnie autorisés</span></label></div>'
      + '<div class="ff" style="margin-bottom:6px"><label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-resolutoire"'+(st.params.clauseResolutoire?' checked':'')+' style="margin-top:2px;flex-shrink:0"/><span><strong>Clause résolutoire</strong> — résiliation de plein droit en cas d\'impayé ou manquement grave après commandement de payer resté infructueux 2 mois</span></label></div>'
      + '<div class="ff" style="margin-bottom:6px"><label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-solidarite"'+(st.params.solidarite?' checked':'')+' style="margin-top:2px;flex-shrink:0"/><span><strong>Clause de solidarité</strong> — multiple locataires solidairement responsables</span></label></div>'
      + '<div id="wb-colocataires-zone" style="margin-left:24px;'+(st.params.solidarite?'':'display:none')+'">'
      + '<div class="ff"><label class="lbl">Noms des co-locataires</label><input type="text" class="inp" id="wb-colocataires" placeholder="Ex : Paul DUPONT, Sophie MARTIN" value="'+e(st.params.multiLocataires||'')+'"/></div>'
      + '</div>'
      + '<div class="ff" style="margin-bottom:6px"><label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-indiv"'+(st.params.indivisibilite?' checked':'')+' style="margin-top:2px;flex-shrink:0"/><span><strong>Clause d\'indivisibilité</strong> — le bail ne peut être divisé entre les locataires</span></label></div>'
      + '</div>'
      + '<div class="sect" style="margin-top:12px">Conditions financières</div>'
      + '<div class="card">'
      + '<div class="ff"><label class="lbl">Jour de paiement du loyer</label><select class="inp" id="wb-jourl">'
      + [1,5,10,15,20,25,28].map(j=>'<option value="'+j+'"'+(st.params.jourPaiement===j?' selected':'')+'>Le '+j+(j===1?'er':'ème')+' de chaque mois</option>').join('')
      + '</select></div>'
      + '<div class="ff"><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-charges-rec" checked/> <span>Inclure la liste des charges récupérables (Décret 87-713)</span></label></div>'
      + '<div class="ff"><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="wb-notice-bail" checked/> <span>Notice d\'information locataire remise lors de la signature</span></label></div>'
      + '</div>'
      + '<div class="ff"><label class="lbl">Clause particulière (optionnel)</label><textarea class="inp" id="wb-clause" rows="3" placeholder="Ex : Accès parking n°5, cave n°2...">'+e(st.params.clauseParticuliere)+'</textarea></div>'
      + '<div class="sect" style="margin-top:12px">Documents obligatoires à annexer</div>'
      + '<div class="card">'
      + _checkItem('DPE annexé', (l.diagnostics||[]).some(d=>d.type==='DPE'), 'Requis — Bilan énergétique du logement')
      + _checkItem('Grille vétusté (si locat. nue)', tb.id==='nu3', 'À joindre si disponible')
      + _checkItem('Inventaire mobilier', tb.id==='meuble1', 'Obligatoire pour les meublés')
      + '</div>'
      + (l.locataire.garant?'<div class="al al-i"><span class="al-ic">🛡</span><div>Garant : <strong>'+e(l.locataire.garant)+'</strong> — une clause de cautionnement sera incluse automatiquement.</div></div>':'');
  }

  // ── Étape 3 : Lecture du bail ──────────────────────────────────────────────
  else if(step===3){
    title = '📖 Lecture du bail';
    var bailHTML = genererContenuBail(l, st.typeBail, st.params);
    content = '<div class="al al-w"><span class="al-ic">⚠️</span><div><strong>Lecture obligatoire</strong> — Lisez l\'intégralité du bail avant de signer. Le bouton de signature se déverrouille à 85% de lecture.</div></div>'
      + '<div id="wb-bail-scroll" style="max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--brd);border-radius:8px;margin:12px 0;background:#fff">'
      + bailHTML
      + '</div>'
      + '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:11px;color:var(--tx3)">Progression de lecture</span><span id="wb-pct-txt" style="font-size:11px;font-weight:700;color:var(--tx3)">0%</span></div>'
      + '<div style="height:4px;background:var(--brd);border-radius:2px;overflow:hidden"><div id="wb-pct-bar" style="height:100%;background:var(--acc);border-radius:2px;width:0%;transition:width .3s"></div></div></div>'
      + '<button id="wb-btn-signer" class="btn bp bfull" disabled style="opacity:.4">✍️ Bail lu — Procéder aux signatures</button>'
      + '<div style="text-align:center;margin-top:8px"><button id="wb-btn-skip-read" class="btn bs bsm" style="font-size:11px;color:var(--tx3)">Déjà lu — Passer ✓</button></div>';
  }

  // ── Étape 4 : Signature bailleur ──────────────────────────────────────────
  else if(step===4){
    title = '✍️ Signature Bailleur — '+e(DB.proprietaire.nom||'Bailleur');
    content = '<div class="al al-i"><span class="al-ic">📱</span><div>Signez au doigt dans le cadre ci-dessous.</div></div>'
      + _canvasSignature('wbs-bailleur', 'Signature du bailleur', DB.proprietaire.nom||'Bailleur');
  }

  // ── Étape 5 : Signature locataire ─────────────────────────────────────────

// ── Finaliser et enregistrer le bail signé ─────────────────────────────────────
function _finaliserBail(){
  var st = window._wbState;
  var l  = DB.logements.find(x=>x.id===st.lid); if(!l)return;
  var tb = TYPES_BAIL.find(t=>t.id===st.typeBail)||TYPES_BAIL[0];
  var today = new Date().toISOString().slice(0,10);

  // Enregistrer dans le logement
  l.signatureBail = {
    requis:false, signee:true, migre:false,
    date:today,
    typeBail:st.typeBail, typeBailLabel:tb.label,
    params:st.params,
    signataireBailleur: DB.proprietaire.nom,
    signataire: l.locataire.nom,
    dataUrlBailleur: st.sigBailleur,
    dataUrl: st.sigLocataire,
  };
  l.bail.type = tb.label;
  if(st.params.jourPaiement) l.bail.jourPaiement = st.params.jourPaiement;

  // Enregistrer le document bail dans les docs avec HTML complet pour voirBailSigne
  var existing = (l.docs||[]).findIndex(d=>d.type==='bail');
  var htmlBailComplet = genererHTMLBailComplet(l, st);
  var bailDoc = {
    id:Date.now(), nom:tb.label+' — '+l.locataire.nom,
    type:'bail', date:today, signee:true,
    typeBail:st.typeBail,
    sigBailleur:st.sigBailleur, sigLocataire:st.sigLocataire,
    htmlBail:htmlBailComplet,   // ← HTML complet pour impression
  };
  if(existing>=0) l.docs[existing]=bailDoc;
  else (l.docs=l.docs||[]).push(bailDoc);

  auditLog(st.lid, 'bail',
    '📝 Bail signé : '+tb.label+' — '+l.locataire.nom+' & '+DB.proprietaire.nom,
    {typeBail:st.typeBail, date:today});

  save();
  st.step=6; renderWizardBailStep(6);
}

// ── HTML complet du bail pour PDF ─────────────────────────────────────────────
function genererHTMLBailComplet(l, st) {
  var tb = TYPES_BAIL.find(t=>t.id===st.typeBail)||TYPES_BAIL[0];
  var contenu = genererContenuBail(l, st.typeBail, st.params);

  // Injecter les signatures dans les zones
  var sigB = st.sigBailleur ?
    '<img src="'+st.sigBailleur+'" style="max-width:180px;height:70px;object-fit:contain"/>' :
    '<div style="width:180px;height:1px;background:#0f2044;margin:50px auto 0"></div>';
  var sigL = st.sigLocataire ?
    '<img src="'+st.sigLocataire+'" style="max-width:180px;height:70px;object-fit:contain"/>' :
    '<div style="width:180px;height:1px;background:#0f2044;margin:50px auto 0"></div>';

  // Inject signatures into the generated bail HTML
  contenu = contenu.replace(
    'id="sig-bailleur-zone"><span style="font-size:11px;color:#b8c4d8">Signature</span></div>',
    'id="sig-bailleur-zone">'+(st.sigBailleur?'<img src="'+st.sigBailleur+'" style="max-width:180px;height:70px;object-fit:contain"/>':'<div style="width:180px;height:1px;background:#0f2044;margin:50px auto 0"></div>')+'</div>'
  );
  contenu = contenu.replace(
    'id="sig-locataire-zone"><span style="font-size:11px;color:#b8c4d8">Signature</span></div>',
    'id="sig-locataire-zone">'+(st.sigLocataire?'<img src="'+st.sigLocataire+'" style="max-width:180px;height:70px;object-fit:contain"/>':'<div style="width:180px;height:1px;background:#0f2044;margin:50px auto 0"></div>')+'</div>'
  );

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bail — '+e(l.nom)+'</title>'+_cssDoc()+'</head><body>'
    +'<div class="pb noprint"><button class="pbb" onclick="window.print()">🖨 Enregistrer en PDF</button></div>'
    +'<div class="page">'+contenu+'</div>'
    +'</body></html>';
}

function _initWizardCanvas(id){
  var canvas = document.getElementById(id+'-canvas'); if(!canvas)return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio||1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx.scale(dpr,dpr);
  ctx.strokeStyle='#0f2044'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
  var drawing=false; var lastX=0; var lastY=0;
  function getPos(e){ var r=canvas.getBoundingClientRect(); var s=e.touches?e.touches[0]:e; return{x:s.clientX-r.left,y:s.clientY-r.top}; }
  function start(e){ e.preventDefault(); drawing=true; var p=getPos(e); lastX=p.x;lastY=p.y; }
  function draw(e){
    if(!drawing)return; e.preventDefault();
    var p=getPos(e);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();
    lastX=p.x;lastY=p.y;
    if(!canvas._hasSig){ canvas._hasSig=true; var ph=document.getElementById(id+'-ph');if(ph)ph.style.display='none'; }
  }
  function stop(e){ e.preventDefault(); drawing=false; }
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',stop);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',draw,{passive:false});canvas.addEventListener('touchend',stop,{passive:false});

  var btnClear = document.getElementById(id+'-clear');
  if(btnClear) btnClear.onclick = function(){
    ctx.clearRect(0,0,canvas.width,canvas.height); canvas._hasSig=false;
    var ph=document.getElementById(id+'-ph');if(ph)ph.style.display='';
  };
}


function voirBailSigne(lid, did) {
  const l = DB.logements.find(x=>x.id===lid); if(!l)return;
  const d = (l.docs||[]).find(x=>x.id===did);
  if(!d||d.type!=='bail'){showToast('Document introuvable');return;}
  // Priorité : HTML stocké lors de la signature
  if(d.htmlBail){
    ouvrirDocumentPDF(d.htmlBail, 'Bail_'+l.nom.replace(/[^a-zA-Z0-9]/g,'_'));
    return;
  }
  // Fallback : regénérer depuis les signatures
  const sig = l.signatureBail||{};
  const st = {
    typeBail: d.typeBail||sig.typeBail||'nu3',
    params: sig.params||{},
    sigBailleur: d.sigBailleur||sig.dataUrlBailleur||null,
    sigLocataire: d.sigLocataire||sig.dataUrl||null,
  };
  ouvrirDocumentPDF(genererHTMLBailComplet(l, st), 'Bail_'+l.nom.replace(/[^a-zA-Z0-9]/g,'_'));
}

      + '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:28px">🔑</span><div><div style="font-weight:700;font-size:14px">Entrée dans les lieux</div><div style="font-size:12px;color:var(--tx2);margin-top:4px">Établi à la remise des clés au locataire</div></div>'+(s.typeEdl==='entree'?'<span style="font-size:20px;margin-left:auto">✅</span>':'')+'</div></div>'
      + '<div id="edl-type-sortie" style="border:2px solid '+(s.typeEdl==='sortie'?'var(--red)':'var(--brd)')+';border-radius:10px;padding:14px;margin-bottom:14px;cursor:pointer;background:'+(s.typeEdl==='sortie'?'var(--red-l)':'var(--surf2)')+'">'
      + '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:28px">🏃</span><div><div style="font-weight:700;font-size:14px">Sortie des lieux</div><div style="font-size:12px;color:var(--tx2);margin-top:4px">Établi lors de la restitution des clés</div></div>'+(s.typeEdl==='sortie'?'<span style="font-size:20px;margin-left:auto">✅</span>':'')+'</div></div>'
      + '<div class="al al-i"><span class="al-ic">ℹ️</span><div>Remplissez chaque pièce du logement. L\'EDL sera signé par les deux parties.</div></div>'
      + '<button class="btn bp bfull" id="edl-btn-next-type">Commencer →</button>';
  }

  // ── Pièces ───────────────────────────────────────────────────────────────
  else if(s.step==='pieces'){
    // Sélectionner les pièces selon le nb de pièces du logement
    var nbPieces = l.pieces||2;
    var piecesActives = PIECES_EDL.filter(function(p){
      if(p.id==='chambre2' && nbPieces<3) return false;
      if(p.id==='buanderie' && nbPieces<4) return false;
      if(p.id==='combles') return false;
      return true;
    });

    if(!s.pieceActive) s.pieceActive = piecesActives[0].id;
    var piece = s.pieces[s.pieceActive] || {etat:'Bon état',obs:'',elements:{}};

    var pieceNav = '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch">'
      + piecesActives.map(function(p){
          var ok = s.pieces[p.id] && s.pieces[p.id].etat;
          return '<button id="edl-pnav-'+p.id+'" style="flex-shrink:0;border:2px solid '+(s.pieceActive===p.id?'var(--acc)':ok?'var(--grn)':'var(--brd)')+';background:'+(s.pieceActive===p.id?'var(--acc-l)':ok?'var(--grn-l)':'var(--surf2)')+';border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:700;white-space:nowrap;min-height:36px">'
          + p.icon+' '+p.label+(ok?' ✓':'')+'</button>';
        }).join('')
      + '</div>';

    var pieceDone = piecesActives.filter(function(p){return s.pieces[p.id]&&s.pieces[p.id].etat;}).length;
    var pieceInfo = PIECES_EDL.find(function(p){return p.id===s.pieceActive;});

    content = pieceNav
      + '<div class="card">'
      + '<div style="font-size:16px;font-weight:700;margin-bottom:12px">'+(pieceInfo?pieceInfo.icon+' '+pieceInfo.label:'Pièce')+'</div>'
      + '<div class="ff"><label class="lbl">État général *</label>'
      + '<select class="inp" id="edl-etat-piece">'
      + ETATS_EDL.map(function(e2){return '<option value="'+e2+'"'+(piece.etat===e2?' selected':'')+'>'+e2+'</option>';}).join('')
      + '</select></div>'
      + '<div class="ff"><label class="lbl">Observations / réserves</label>'
      + '<textarea class="inp" id="edl-obs-piece" rows="3" placeholder="Ex : Tache au plafond, rayure sur parquet, prise murale défectueuse...">'+(piece.obs||'')+'</textarea></div>'
      + '<div style="display:flex;gap:8px">'
      + '<button class="btn bs bsm" id="edl-btn-save-piece">💾 Enregistrer cette pièce</button>'
      + '</div></div>'
      + '<div style="font-size:11px;color:var(--tx3);text-align:center;margin:8px 0">'+pieceDone+'/'+piecesActives.length+' pièces renseignées</div>'
      + '<button class="btn bp bfull" id="edl-btn-next-pieces"'+(pieceDone<piecesActives.length?' style="opacity:.5"':'')+'>Continuer →</button>';
  }

  // ── Relevés compteurs ─────────────────────────────────────────────────────
  else if(s.step==='releves'){
    content = '<div class="sect">Relevés des compteurs</div>'
      + '<div class="al al-i"><span class="al-ic">📊</span><div>Notez les indices des compteurs au moment de l\'état des lieux. Ces relevés engagent les deux parties.</div></div>'
      + RELEVES_EDL.map(function(rel){
          return '<div class="ff"><label class="lbl">'+rel+'</label>'
            + '<input type="number" class="inp" id="edl-rel-'+rel.replace(/\s/g,'')+'" placeholder="Index compteur" value="'+(s.releves[rel]||'')+'"/></div>';
        }).join('')
      + '<div class="ff"><label class="lbl">Date de l\'état des lieux *</label>'
      + '<input type="date" class="inp" id="edl-date" value="'+new Date().toISOString().slice(0,10)+'"/></div>'
      + '<div style="display:flex;gap:8px;margin-top:4px">'
      + '<button class="btn bs" id="edl-back-releves">← Retour</button>'
      + '<button class="btn bp" style="flex:1" id="edl-next-releves">Suivant →</button>'
      + '</div>';
  }

  // ── Clés ──────────────────────────────────────────────────────────────────
  else if(s.step==='cles'){
    content = '<div class="sect">Remise des clés</div>'
      + '<div class="g2">'
      + '<div class="ff"><label class="lbl">Clés bailleur</label><input type="number" class="inp" id="edl-cles-b" min="0" value="'+(s.cles.bailleur||0)+'"/></div>'
      + '<div class="ff"><label class="lbl">Clés locataire</label><input type="number" class="inp" id="edl-cles-l" min="0" value="'+(s.cles.locataire||2)+'"/></div>'
      + '</div>'
      + '<div class="ff"><label class="lbl">Badges / Télécommandes boîte aux lettres</label><input type="number" class="inp" id="edl-cles-ba" min="0" value="'+(s.cles.boiteAux||1)+'"/></div>'
      + '<div style="display:flex;gap:8px;margin-top:8px">'
      + '<button class="btn bs" id="edl-back-cles">← Retour</button>'
      + '<button class="btn bp" style="flex:1" id="edl-next-cles">Procéder aux signatures →</button>'
      + '</div>';
  }

  // ── Signature bailleur ────────────────────────────────────────────────────
  else if(s.step==='sig_b'){
    content = '<div class="al al-i"><span class="al-ic">✍️</span><div><strong>'+e(DB.proprietaire.nom||'Bailleur')+'</strong> — Signez pour valider l\'état des lieux.</div></div>'
      + _canvasSignature('edls-bailleur','Signature bailleur',DB.proprietaire.nom||'Bailleur')
      + '<div style="display:flex;gap:8px;margin-top:4px"><button class="btn bs" id="edl-back-sigb">← Retour</button>'
      + '<button class="btn bp" style="flex:1" id="edl-val-sigb">Valider →</button></div>';
  }

  // ── Signature locataire ───────────────────────────────────────────────────
  else if(s.step==='sig_l'){
    content = '<div class="al al-s"><span class="al-ic">✅</span><div>Bailleur a signé. Passez le téléphone au locataire.</div></div>'
      + '<div class="al al-i"><span class="al-ic">📱</span><div><strong>'+e(l.locataire.nom||'Locataire')+'</strong> — Signez pour valider l\'état des lieux.</div></div>'
      + _canvasSignature('edls-locataire','Signature locataire',l.locataire.nom||'Locataire')
      + '<div style="display:flex;gap:8px;margin-top:4px"><button class="btn bs" id="edl-back-sigl">← Retour</button>'
      + '<button class="btn bp" style="flex:1" id="edl-val-sigl">✓ Finaliser</button></div>';
  }

  // ── Fin ───────────────────────────────────────────────────────────────────
  else if(s.step==='fin'){
    content = '<div class="al al-s"><span class="al-ic">🎉</span><div><strong>État des lieux finalisé et signé !</strong></div></div>'
      + '<div class="card">'
      + '<div class="dlrow"><span class="dlk">Type</span><span class="dlv">'+(s.typeEdl==='entree'?'Entrée':'Sortie')+'</span></div>'
      + '<div class="dlrow"><span class="dlk">Pièces renseignées</span><span class="dlv">'+Object.keys(s.pieces).length+'</span></div>'
      + '<div class="dlrow"><span class="dlk">Signé bailleur</span><span class="dlv" style="color:var(--grn)">✅</span></div>'
      + '<div class="dlrow" style="border:none"><span class="dlk">Signé locataire</span><span class="dlv" style="color:var(--grn)">✅</span></div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px">'
      + '<button class="btn bp bfull" id="edl-btn-pdf">📄 Voir et imprimer l\'EDL</button>'
      + '<button class="btn bfull" id="edl-btn-email" style="background:var(--grn);color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:700">📧 Envoyer au locataire</button>'
      + '<button class="btn bs bfull" id="edl-btn-close">✓ Fermer</button>'
      + '</div>';
  }

  m.innerHTML = '<div class="modal-box">'
    + '<div class="mhdr"><span class="mtitle">🔑 État des lieux</span>'
    + '<button class="mclose" id="wedl-close">×</button></div>'
    + progH + content + '</div>';

  document.body.appendChild(m);

  // ── Event listeners ──────────────────────────────────────────────────────
  var btnClose = document.getElementById('wedl-close');
  if(btnClose) btnClose.onclick = function(){ var mm=document.getElementById('m-wedl');if(mm)mm.remove(); };

  if(s.step==='type'){
    ['entree','sortie'].forEach(function(t){
      var el=document.getElementById('edl-type-'+t);
      if(el) el.onclick=function(){ s.typeEdl=t; renderWizardEdl(); };
    });
    var nb=document.getElementById('edl-btn-next-type');
    if(nb) nb.onclick=function(){ s.step='pieces'; renderWizardEdl(); };
  }

  if(s.step==='pieces'){
    // Navigation entre pièces
    var nbPieces2 = l.pieces||2;
    PIECES_EDL.filter(function(p){
      if(p.id==='chambre2'&&nbPieces2<3)return false;
      if(p.id==='buanderie'&&nbPieces2<4)return false;
      if(p.id==='combles')return false; return true;
    }).forEach(function(p){
      var btn=document.getElementById('edl-pnav-'+p.id);
      if(btn) btn.onclick=function(){ _edlSavePiece(); s.pieceActive=p.id; renderWizardEdl(); };
    });
    var saveP=document.getElementById('edl-btn-save-piece');
    if(saveP) saveP.onclick=function(){ _edlSavePiece(); renderWizardEdl(); };
    var nextP=document.getElementById('edl-btn-next-pieces');
    if(nextP) nextP.onclick=function(){ _edlSavePiece(); s.step='releves'; renderWizardEdl(); };
  }

  if(s.step==='releves'){
    var backR=document.getElementById('edl-back-releves'); if(backR)backR.onclick=function(){s.step='pieces';renderWizardEdl();};
    var nextR=document.getElementById('edl-next-releves');
    if(nextR) nextR.onclick=function(){
      RELEVES_EDL.forEach(function(rel){
        var el=document.getElementById('edl-rel-'+rel.replace(/\s/g,''));
        if(el&&el.value) s.releves[rel]=el.value;
      });
      s.dateEdl=(document.getElementById('edl-date')&&document.getElementById('edl-date').value)||new Date().toISOString().slice(0,10);
      s.step='cles'; renderWizardEdl();
    };
  }

  if(s.step==='cles'){
    var backC=document.getElementById('edl-back-cles'); if(backC)backC.onclick=function(){s.step='releves';renderWizardEdl();};
    var nextC=document.getElementById('edl-next-cles');
    if(nextC) nextC.onclick=function(){
      var g3=function(id){return document.getElementById(id);};
      s.cles.bailleur=parseInt((g3('edl-cles-b')&&g3('edl-cles-b').value)||'0');
      s.cles.locataire=parseInt((g3('edl-cles-l')&&g3('edl-cles-l').value)||'2');
      s.cles.boiteAux=parseInt((g3('edl-cles-ba')&&g3('edl-cles-ba').value)||'0');
      s.step='sig_b'; renderWizardEdl();
    };
  }

  if(s.step==='sig_b'){
    setTimeout(function(){ _initWizardCanvas('edls-bailleur'); },80);
    var backB=document.getElementById('edl-back-sigb'); if(backB)backB.onclick=function(){s.step='cles';renderWizardEdl();};
    var valB=document.getElementById('edl-val-sigb');
    if(valB) valB.onclick=function(){
      var cv=document.getElementById('edls-bailleur-canvas');
      if(!cv||!cv._hasSig){alert('Signez dans le cadre.');return;}
      s.sigBailleur=cv.toDataURL('image/png');
      s.step='sig_l'; renderWizardEdl();
    };
  }

  if(s.step==='sig_l'){
    setTimeout(function(){ _initWizardCanvas('edls-locataire'); },80);
    var backL=document.getElementById('edl-back-sigl'); if(backL)backL.onclick=function(){s.step='sig_b';renderWizardEdl();};
    var valL=document.getElementById('edl-val-sigl');
    if(valL) valL.onclick=function(){
      var cv=document.getElementById('edls-locataire-canvas');
      if(!cv||!cv._hasSig){alert('Le locataire doit signer.');return;}
      s.sigLocataire=cv.toDataURL('image/png');
      _finaliserEdl();
    };
  }

  if(s.step==='fin'){
    var btnPdfEdl=document.getElementById('edl-btn-pdf');
    if(btnPdfEdl) btnPdfEdl.onclick=function(){
      ouvrirDocumentPDF(genererHTMLEdl(DB.logements.find(x=>x.id===s.lid),s),'EDL');
    };
    var btnEmailEdl=document.getElementById('edl-btn-email');
    if(btnEmailEdl) btnEmailEdl.onclick=function(){
      var l2=DB.logements.find(x=>x.id===s.lid);
      envoyerAvecPDF({
        to:l2.locataire.email,
        subject:'État des lieux '+(s.typeEdl==='entree'?'d\'entrée':'de sortie')+' — '+l2.adresse,
        body:'Bonjour '+l2.locataire.nom+',\n\nVeuillez trouver ci-joint l\'état des lieux '+(s.typeEdl==='entree'?'d\'entrée':'de sortie')+' signé.\n\nCordialement,\n'+DB.proprietaire.nom,
        htmlContent:genererHTMLEdl(l2,s),
        pdfNom:'EDL_'+s.typeEdl+'_'+l2.nom.replace(/[^a-zA-Z0-9]/g,'_')+'.pdf',
      });
    };
    var btnCloseEdl=document.getElementById('edl-btn-close');
    if(btnCloseEdl) btnCloseEdl.onclick=function(){
      var mm=document.getElementById('m-wedl'); if(mm)mm.remove();
      renderFicheTab(DB.logements.find(x=>x.id===s.lid),'conformité');
    };
  }
}

function _edlSavePiece(){
  var s=window._edlState; if(!s||!s.pieceActive)return;
  var etatEl=document.getElementById('edl-etat-piece');
  var obsEl=document.getElementById('edl-obs-piece');
  if(etatEl||obsEl){
    s.pieces[s.pieceActive]={
      etat:(etatEl&&etatEl.value)||'Bon état',
      obs:(obsEl&&obsEl.value)||'',
    };
  }
}

function _finaliserEdl(){
  var s=window._edlState;
  var l=DB.logements.find(x=>x.id===s.lid); if(!l)return;
  var today=(s.dateEdl)||new Date().toISOString().slice(0,10);
  var htmlEdl=genererHTMLEdl(l,s);
  var doc={
    id:Date.now(),
    nom:'EDL '+(s.typeEdl==='entree'?'entrée':'sortie')+' — '+l.locataire.nom,
    type:'edl', date:today, signee:true,
    typeEdl:s.typeEdl,
    sigBailleur:s.sigBailleur, sigLocataire:s.sigLocataire,
    pieces:s.pieces, releves:s.releves, cles:s.cles,
    htmlEdl:htmlEdl,
  };
  // Remplacer EDL existant du même type ou ajouter
  l.docs=l.docs||[];
  var existing=l.docs.findIndex(d=>d.type==='edl'&&d.typeEdl===s.typeEdl);
  if(existing>=0) l.docs[existing]=doc; else l.docs.push(doc);
  auditLog(s.lid,'document','🔑 EDL '+(s.typeEdl==='entree'?'entrée':'sortie')+' signé',{typeEdl:s.typeEdl,pieces:Object.keys(s.pieces).length});
  save();
  s.step='fin'; renderWizardEdl();
}

function genererHTMLEdl(l, s) {
  var prop=DB.proprietaire;
  var today=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  var dateEdl=s.dateEdl?new Date(s.dateEdl).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):today;
  var typeLabel=s.typeEdl==='entree'?"d\'entrée dans les lieux":"de sortie des lieux";

  var piecesHTML='';
  PIECES_EDL.forEach(function(p){
    var data=s.pieces[p.id];
    if(!data)return;
    var etatColor=data.etat==='Neuf'||data.etat==='Très bon état'?'#1a6e45':data.etat==='Bon état'||data.etat==='État correct'?'#1e4fa0':data.etat==='Usure normale'?'#b86e0a':'#b52b2b';
    piecesHTML+='<tr style="border-bottom:1px solid #e8edf5">'
      +'<td style="padding:8px 10px;font-weight:600">'+p.icon+' '+p.label+'</td>'
      +'<td style="padding:8px 10px;color:'+etatColor+';font-weight:700">'+data.etat+'</td>'
      +'<td style="padding:8px 10px;font-size:12px;color:#475569">'+(data.obs||'—')+'</td>'
      +'</tr>';
  });

  var relevesHTML='';
  Object.keys(s.releves||{}).forEach(function(rel){
    relevesHTML+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e8edf5"><span style="color:#475569">'+rel+'</span><strong>'+s.releves[rel]+'</strong></div>';
  });

  var sigB=s.sigBailleur?'<img src="'+s.sigBailleur+'" style="max-width:160px;height:60px;object-fit:contain"/>':'<div style="width:140px;height:1px;background:#0f2044;margin-top:50px"></div>';
  var sigL=s.sigLocataire?'<img src="'+s.sigLocataire+'" style="max-width:160px;height:60px;object-fit:contain"/>':'<div style="width:140px;height:1px;background:#0f2044;margin-top:50px"></div>';

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>EDL '+(s.typeEdl==='entree'?'Entrée':'Sortie')+' — '+e(l.nom)+'</title>'+_cssDoc()
    +'<style>table{width:100%;border-collapse:collapse}th{background:#0f2044;color:#fff;padding:8px 10px;text-align:left;font-size:12px}tr:nth-child(even){background:#f8fafc}</style>'
    +'</head><body>'
    +'<div class="pb noprint"><button class="pbb" onclick="window.print()">🖨 Imprimer</button></div>'
    +'<div class="page">'
    // En-tête
    +'<div style="background:linear-gradient(135deg,#1a3260,#0f2044);color:#fff;padding:20px;border-radius:8px 8px 0 0">'
    +'<div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#c8a84b;font-family:monospace;margin-bottom:6px">ÉTAT DES LIEUX</div>'
    +'<div style="font-size:20px;font-weight:700">État des lieux '+typeLabel+'</div>'
    +'<div style="font-size:12px;color:#8eaacf;margin-top:4px">'+dateEdl+'</div>'
    +'</div>'
    +'<div style="background:#fff;border:1px solid #d6dce8;border-top:none;padding:20px;border-radius:0 0 8px 8px">'
    // Parties
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">'
    +'<div style="background:#f4f6fb;border-radius:8px;padding:12px"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#7d92b0;margin-bottom:6px">Bailleur</div><div style="font-weight:700">'+e(prop.nom||'—')+'</div><div style="font-size:12px;color:#3d5075">'+e(prop.adresse||'')+'</div></div>'
    +'<div style="background:#f4f6fb;border-radius:8px;padding:12px"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#7d92b0;margin-bottom:6px">Locataire</div><div style="font-weight:700">'+e(l.locataire.nom||'—')+'</div><div style="font-size:12px;color:#3d5075">'+e(l.adresse||'')+'</div></div>'
    +'</div>'
    // Logement
    +'<div style="background:#f4f6fb;border-radius:8px;padding:12px;margin-bottom:16px">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px">'
    +'<div><span style="color:#7d92b0">Surface</span><div style="font-weight:700">'+l.surface+' m²</div></div>'
    +'<div><span style="color:#7d92b0">Pièces</span><div style="font-weight:700">'+l.pieces+'</div></div>'
    +'<div><span style="color:#7d92b0">DPE</span><div style="font-weight:700">'+l.dpe+'</div></div>'
    +'</div></div>'
    // Tableau pièces
    +'<h3 style="font-size:13px;font-weight:700;text-transform:uppercase;color:#3d5075;margin-bottom:10px">État des pièces</h3>'
    +'<table><thead><tr><th>Pièce</th><th>État</th><th>Observations</th></tr></thead><tbody>'+piecesHTML+'</tbody></table>'
    // Relevés
    +(relevesHTML?'<h3 style="font-size:13px;font-weight:700;text-transform:uppercase;color:#3d5075;margin:16px 0 10px">Relevés des compteurs</h3><div style="background:#f4f6fb;border-radius:8px;padding:12px">'+relevesHTML+'</div>':'')
    // Clés
    +'<h3 style="font-size:13px;font-weight:700;text-transform:uppercase;color:#3d5075;margin:16px 0 10px">Clés remises</h3>'
    +'<div style="display:flex;gap:20px;font-size:12px">'
    +'<div>Bailleur : <strong>'+s.cles.bailleur+'</strong></div>'
    +'<div>Locataire : <strong>'+s.cles.locataire+'</strong></div>'
    +'<div>Badge/télécommande : <strong>'+s.cles.boiteAux+'</strong></div>'
    +'</div>'
    // Signatures
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px">'
    +'<div style="background:#f4f6fb;border-radius:8px;padding:14px;text-align:center">'
    +'<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#7d92b0;margin-bottom:8px">Bailleur</div>'
    +'<div style="font-weight:700;margin-bottom:8px">'+e(prop.nom||'—')+'</div>'+sigB+'</div>'
    +'<div style="background:#f4f6fb;border-radius:8px;padding:14px;text-align:center">'
    +'<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:#7d92b0;margin-bottom:8px">Locataire</div>'
    +'<div style="font-weight:700;margin-bottom:8px">'+e(l.locataire.nom||'—')+'</div>'+sigL+'</div>'
    +'</div>'
    // Pied
    +'<div style="margin-top:20px;text-align:center;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px">'
    +'Fait le '+dateEdl+' en deux exemplaires originaux — Usage privé'
    +'</div>'
    +'</div></div>'
    +'</body></html>';
}

// ── RGPD & WIPE ──────────────────────────────────────────────────────────────
function closeRgpd(){
  g('rgpd').style.display='none';
  try{localStorage.setItem('foncio_rgpd','1');}catch(e){}
}
function wipe(){
  if(confirm('Supprimer définitivement toutes vos données Foncio de cet appareil ?')){
    try{Object.keys(localStorage).filter(k=>k.startsWith('foncio_')).forEach(k=>localStorage.removeItem(k));}catch(ex){}
    DB={proprietaire:{nom:'',email:'',adresse:''},logements:[]};
    go('tableau');
  }
}

window.addEventListener('DOMContentLoaded', function(){
  // Splash bar animation
  setTimeout(function(){ const f=g('sfill'); if(f)f.style.width='100%'; }, 60);
  // Hide splash
  setTimeout(function(){
    const s=g('splash');
    if(s){ s.classList.add('out'); setTimeout(function(){ s.remove(); },600); }
  }, 1700);
  // RGPD
  try{ if(!localStorage.getItem('foncio_rgpd')) g('rgpd').style.display='flex'; }catch(ex){}
  // First render
  badges();
  renderTableau();
  // Demander permission notifications (iOS 16.4+ en PWA)
  setTimeout(demanderPermissionNotifications, 2000);
  // Vérifier appels de loyer à générer
  setTimeout(() => { checkEtNotifierAppels(); }, 1500);
});
