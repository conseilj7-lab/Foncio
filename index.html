    +(estPartiel?'<tr style="background:#fff8f0"><td style="padding:8px 14px;font-weight:700;font-size:12px;color:#b52b2b">Solde restant dû</td><td style="padding:8px 14px;text-align:right;font-family:monospace;font-size:13px;color:#b52b2b;font-weight:700">'+fmt(dette)+' €</td></tr>':'')
    +'</tbody></table>';
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quittance '+e(mois)+'</title>'+_cssDoc()+'</head><body>'

    +'<div class="page">'

    +'<div><div class="hl">Quittance de loyer</div><div class="ht">'+e(mois)+'</div><div class="hn">N° '+num+'</div></div>'
    +'<div style="text-align:right"><div class="badge" style="background:'+badgeColor+'">'+badgeLabel+'</div><div class="hl" style="margin-top:8px">'+(estPartiel?'Partiel le':'Encaissé le')+'</div><div style="color:#fff;font-size:12px;font-weight:600;margin-top:2px">'+fmtD(p.date)+'</div></div>'

function ouvrirDocumentPDF(htmlContent, titre){
  // Fermer modals et nettoyer
  document.querySelectorAll('.modal-bg').forEach(function(m){ m.remove(); });
  ['pdf-overlay','pdf-bar','pdf-doc-style','pdf-print-style'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.remove();
  });

  // ── Overlay plein écran opaque ──────────────────────────────────────────
  var overlay = document.createElement('div');
  overlay.id = 'pdf-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:#e8edf3;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px';

  // Conteneur document
  var content = document.createElement('div');
  content.id = 'pdf-content';
  content.style.cssText = 'max-width:740px;margin:0 auto;padding:10px;background:transparent';

  // Extraire body + style du HTML généré
  var bodyMatch   = htmlContent.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  var styleMatch  = htmlContent.match(/<style[^>]*>([\s\S]*?)<\/style>/i);

  if(styleMatch){
    var sEl = document.createElement('style');
    sEl.id  = 'pdf-doc-style';
    var css = styleMatch[1]
      // Supprimer règles globales
      .replace(/(^|\})\s*(html\s*,\s*body|body|html)\s*\{[^}]*\}/g,'$1')
      .replace(/(^|\})\s*\*\s*\{[^}]*\}/g,'$1')
      .replace(/@page\s*\{[^}]*\}/g,'');
    // Isoler au conteneur
    css += '#pdf-content .pb,#pdf-content .noprint{display:none !important}';
    css += '#pdf-content .page{width:100% !important;background:#fff !important;box-shadow:0 2px 20px rgba(0,0,0,.12);border-radius:6px;overflow:hidden}';
    css += '@media(max-width:600px){#pdf-content .page{border-radius:0}}';
    sEl.textContent = css;
    document.head.appendChild(sEl);
  }
  content.innerHTML = bodyMatch ? bodyMatch[1] : htmlContent;
  overlay.appendChild(content);

  // ── Barre fixe en bas ────────────────────────────────────────────────────
  var bar = document.createElement('div');
  bar.id = 'pdf-bar';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+12px);background:#0f2044;border-top:2px solid #c8a84b;box-shadow:0 -4px 24px rgba(0,0,0,.4)';

  var btnFermer = document.createElement('button');
  btnFermer.id  = 'pdf-close-btn';
  btnFermer.textContent = '✕ Fermer';
  btnFermer.style.cssText = 'flex:1;background:#b52b2b;color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px';

  var btnPrint = document.createElement('button');
  btnPrint.id  = 'pdf-print-btn';
  btnPrint.textContent = '🖨 PDF';
  btnPrint.style.cssText = 'flex:1;background:#c8a84b;color:#0f2044;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:50px';

  bar.appendChild(btnFermer);
  bar.appendChild(btnPrint);
  document.body.appendChild(overlay);
  document.body.appendChild(bar);
  document.body.style.overflow = 'hidden';

  // ── Fermeture ────────────────────────────────────────────────────────────
  function fermer(){
    ['pdf-overlay','pdf-bar','pdf-doc-style','pdf-print-style'].forEach(function(id){
      var el=document.getElementById(id); if(el) el.remove();
    });
    document.body.style.overflow = '';
  }
  btnFermer.onclick    = fermer;
  btnFermer.ontouchend = function(e){ e.preventDefault(); fermer(); };

  // ── Impression Safari ────────────────────────────────────────────────────
  // Sur iOS Safari : remplacer temporairement le body par le HTML du document
  // c'est la SEULE méthode fiable pour imprimer proprement
  function imprimer(){
    // Méthode propre : @media print masque tout sauf l'overlay
    // NE PAS remplacer document.body.innerHTML → casse les event listeners iOS
    var ps = document.createElement('style');
    ps.id  = 'pdf-print-style';
    ps.textContent = [
      '@media print{',
      ' *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}',
      ' body>*:not(#pdf-overlay){display:none !important}',
      ' #pdf-overlay{position:static !important;overflow:visible !important;padding:0 !important;height:auto !important;background:#fff !important}',
      ' #pdf-bar,#pdf-close-btn,#pdf-print-btn{display:none !important}',
      ' #pdf-content{max-width:none !important;padding:0 !important;margin:0 !important}',
      ' #pdf-content .page{width:100% !important;box-shadow:none !important;border-radius:0 !important}',
      ' @page{size:A4 portrait;margin:10mm}',
      '}'
    ].join('');
    document.head.appendChild(ps);
    setTimeout(function(){
      window.print();
      setTimeout(function(){
        var s=document.getElementById('pdf-print-style');
        if(s) s.remove();
      }, 1500);
    }, 150);
  }
  btnPrint.onclick    = imprimer;
  btnPrint.ontouchend = function(e){ e.preventDefault(); imprimer(); };
}

function showToast(msg, duration=3500) {

function doSMS(){
  const tel=v('sms-tel').replace(/\s/g,''); const body=g('sms-body')?.value||'';

  window.location.href='sms:'+tel+'&body='+encodeURIComponent(body);
  g('m-sms').remove();
}

function saveEditLocataire(lid) {
  const l = DB.logements.find(x => x.id === lid); if (!l) return;
  const loc = l.locataire;
  const motif = (g('el-motif')?.value || '').trim();
  if (!motif) { alert('Le motif de modification est obligatoire.'); return; }
  const nom = (g('el-nom')?.value || '').trim().slice(0, 100);
  if (!nom) { alert('Le nom est obligatoire.'); return; }
  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const heureStr = now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  const audit = (l.locataire.audit = l.locataire.audit || []);
  const champs = [
    {key:'nom',    label:'Nom',         newVal:nom},
    {key:'email',  label:'Email',        newVal:(g('el-email')?.value||'').trim().slice(0,200)},
    {key:'tel',    label:'Tél.',         newVal:(g('el-tel')?.value||'').trim().slice(0,30)},
    {key:'entree', label:'Date entrée',  newVal:g('el-entree')?.value||''},
    {key:'garant', label:'Garant',       newVal:(g('el-garant')?.value||'').trim().slice(0,100)},
  ];
  const modifs = champs.filter(c => (loc[c.key]||'') !== (c.newVal||'')).map(c => ({champ:c.key, label:c.label, avant:loc[c.key]||'', apres:c.newVal||''}));
  if (modifs.length === 0) { alert('Aucune modification détectée.'); g('m-edit-loc').remove(); return; }
  const auditEntry = {
    type:'modification', date:dateStr, heure:heureStr,
    desc: motif + ' (' + modifs.map(c=>c.label).join(', ') + ')',
    avant: modifs.map(c=>c.label+': '+(c.avant||'vide')).join(' | '),
    apres: modifs.map(c=>c.label+': '+(c.apres||'vide')).join(' | '),
    modifs: modifs,
    auteur: DB.proprietaire.nom || 'Propriétaire',
  };
  audit.push(auditEntry);
  // Aussi tracer dans l'audit global du logement
  auditLog(lid, 'modification', '👤 Locataire modifié : '+motif+' ('+modifs.map(c=>c.label).join(', ')+')', {motif, modifs});
  modifs.forEach(c => { loc[c.champ] = c.apres; });
  save();
  g('m-edit-loc').remove();
  renderFicheTab(DB.logements.find(x=>x.id===lid), 'locataire');
}

function showAuditComplet(lid) {
  const l = DB.logements.find(x => x.id === lid); if (!l) return;
  // Fusionner audit global du logement + audit locataire (pour rétrocompatibilité)
  const allAudit = [].concat(l.audit||[], l.locataire.audit||[]);
  // Dédupliquer par date+heure+type (les modifs locataire sont aussi dans l.audit maintenant)
  const seen = new Set();
  const audit = allAudit.filter(a=>{
    const k = (a.date||'')+'|'+(a.heure||'')+'|'+(a.type||'')+'|'+(a.desc||'').slice(0,40);
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a,b)=>{
    const da = (a.date||'')+' '+(a.heure||'');
    const db = (b.date||'')+' '+(b.heure||'');
    return db.localeCompare(da);
  });
  const m = document.createElement('div'); m.className = 'modal-bg'; m.id = 'm-audit';
  const auditHTML = audit.length === 0
    ? '<p style="color:var(--tx3);font-size:13px;text-align:center;padding:20px">Aucune modification.</p>'
    : audit.map(a => `
      <div style="border-left:3px solid ${a.type==='création'?'var(--grn)':'var(--acc)'};padding:10px 12px;margin-bottom:8px;background:var(--surf2);border-radius:0 8px 8px 0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
          <div>
            <span style="font-size:10px;font-weight:700;color:${a.type==='création'?'var(--grn)':'var(--acc)'};text-transform:uppercase;letter-spacing:.06em;font-family:monospace">${a.type}</span>
            ${a.auteur?`<span style="font-size:10px;color:var(--tx3);margin-left:6px">· ${e(a.auteur)}</span>`:''}
          </div>
          <span style="font-size:10px;color:var(--tx3);font-family:monospace">${fmtD(a.date)}${a.heure?' '+a.heure:''}</span>
        </div>
        <div style="font-size:13px;color:var(--tx);margin-bottom:4px">${e(a.desc)}</div>
        ${(a.modifs||[]).map(mod=>`
          <div style="font-size:11px;color:var(--tx3);margin-top:3px;padding:3px 8px;background:#fff;border-radius:4px">
            <span style="font-family:monospace;color:var(--acc)">${mod.label||mod.champ}</span>
            <span style="color:var(--red)"> ${e(mod.avant||'vide')}</span>
            <span> →</span>
            <span style="color:var(--grn)"> ${e(mod.apres||'vide')}</span>
          </div>`).join('')}
      </div>`).join('');
  m.innerHTML = `<div class="modal-box">
    <div class="mhdr">
      <span class="mtitle">📋 Piste d'audit — ${e(l.locataire.nom)}</span>
      <button class="mclose" onclick="g('m-audit').remove()">×</button>
    </div>
    <div style="background:var(--surf2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--tx2)">
      ${audit.length} événement${audit.length>1?'s':''} tracé${audit.length>1?'s':''} · ${e(l.nom)}
    </div>
    <div style="max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch">${auditHTML}</div>
    <button class="btn bp bfull" style="margin-top:12px" onclick="g('m-audit').remove()">Fermer</button>
  </div>`;
  document.body.appendChild(m);
}

    <div class="card" style="margin-top:10px;margin-bottom:10px">
      <div class="sect">Récapitulatif bail</div>
      <div class="dlrow"><span class="dlk">Logement</span><span class="dlv">${e(l.nom)}</span></div>

    </div>
    <div class="card bl-a" style="margin-bottom:10px">
      <div class="sect">Zone de signature bailleur</div>
      <p style="font-size:13px;color:var(--tx2);margin-bottom:10px">En signant, vous certifiez les informations ci-dessus exactes et vous engagez aux termes du bail.</p>
      <div style="border:2px solid var(--brd);border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--surf2)" id="sig-zone">
        <span style="color:var(--tx3);font-size:13px">Appuyez ici pour apposer votre signature</span>
      </div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;cursor:pointer;line-height:1.5">
        <input type="checkbox" id="sig-consent" style="margin-top:2px;flex-shrink:0"/>
        Je soussigné(e) <strong>${e(DB.proprietaire.nom)}</strong>, bailleur, certifie avoir lu et approuvé les termes du présent bail et donne mon accord pour sa conclusion.

function signerBail(lid){
  if(!g('sig-consent')?.checked){alert('Veuillez cocher la case de consentement pour signer.');return;}
  const l=DB.logements.find(x=>x.id===lid); if(!l)return;
  l.signatureBail={requis:true, signee:true, date:new Date().toISOString().slice(0,10), migre:false};
  save();
  g('m-sign').remove();
  // Propose email au locataire
  const body='Madame, Monsieur '+l.locataire.nom+',\n\nVotre bail pour le logement situé '+l.adresse+' a été signé électroniquement par le bailleur '+DB.proprietaire.nom+' en date du '+new Date().toLocaleDateString('fr-FR')+'.\n\nConditions :\n- Loyer HC : '+l.bail.loyer+' €/mois\n- Charges : '+l.bail.charges+' €/mois\n- Dépôt de garantie : '+l.bail.depot+' €\n- Prise d\'effet : '+fmtD(l.bail.debut)+'\n\nCordialement,\n'+DB.proprietaire.nom;
  modalEmail({to:l.locataire.email, subject:'Bail signé — '+l.adresse, body, title:'Envoyer copie au locataire'});
}

function envSignature(lid){
  const l=DB.logements.find(x=>x.id===lid); if(!l)return;
  const body='Madame, Monsieur '+l.locataire.nom+',\n\nVeuillez trouver ci-joint votre copie du bail signé pour '+l.adresse+'.\n\nCordialement,\n'+DB.proprietaire.nom;
  modalEmail({to:l.locataire.email, subject:'Copie bail signé — '+l.adresse, body, title:'Renvoyer copie bail'});
}

// ── EXPORT / IMPORT DONNÉES (mise à jour sans perte) ─────────────────────────
function exporterDonnees() {
  const exportData = Object.assign({}, DB, {
    _export: { date: new Date().toISOString(), version: 'foncio_v1', logements: DB.logements.length }
  });
  const data = JSON.stringify(exportData, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'foncio_sauvegarde_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Sauvegarde téléchargée ! Conservez ce fichier précieusement.', 5000);
}

function importerDonnees() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.logements || !Array.isArray(data.logements)) throw new Error('Format invalide');
        if (confirm('Restaurer les données depuis ce fichier ? Vos données actuelles seront remplacées.')) {
          DB = data;
          save();
          renderTableau();
          showToast('✅ Données restaurées avec succès !', 4000);
        }
      } catch(err) {
        alert('Fichier invalide : ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

      <div style="font-size:12px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Dette locative totale</div>
      <div style="font-size:32px;font-weight:700;color:var(--red);font-family:monospace">${fmt(dette)} €</div>
      <div style="font-size:11px;color:var(--tx2);margin-top:4px">${partiels.length} paiement${partiels.length>1?'s':''} partiel${partiels.length>1?'s':''} · ${impayes.length} impayé${impayes.length>1?'s':''}</div>

// ── COMPLÉTER UN PAIEMENT PARTIEL ────────────────────────────────────────────
function completerPaiement(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  const dette = p.dette || Math.max(0, (p.montantAttendu||0) - (p.montantEncaisse||0));
  const today = new Date().toISOString().slice(0,10);
  const m = document.createElement('div'); m.className='modal-bg'; m.id='m-compl';
  m.innerHTML = `<div class="modal-box">
    <div class="mhdr">
      <span class="mtitle">💶 Compléter le paiement</span>
      <button class="mclose" onclick="g('m-compl').remove()">×</button>
    </div>
    <div style="background:var(--org-l);border:1px solid var(--org);border-radius:8px;padding:12px;margin-bottom:14px">
      <div class="dlrow"><span class="dlk">Période</span><span class="dlv" style="text-transform:capitalize">${moisLbl(p.mois)}</span></div>
      <div class="dlrow"><span class="dlk">Déjà encaissé</span><span class="dlv" style="color:var(--grn);font-family:monospace">${fmt(p.montantEncaisse||0)} €</span></div>
      <div class="dlrow" style="border:none"><span class="dlk" style="font-weight:700;color:var(--org)">Reste dû</span><span class="dlv" style="font-family:monospace;font-weight:700;color:var(--red)">${fmt(dette)} €</span></div>
    </div>
    <div class="ff">
      <label class="lbl">Montant du complément (€)</label>
      <input type="number" class="inp" id="compl-mt" value="${dette}" min="0" step="0.01"
        style="font-size:18px;font-weight:700;text-align:center"
        oninput="majBilanComplement(this.value,${dette},${p.montantEncaisse||0},${p.montantAttendu||0})"/>
    </div>
    <div class="ff">
      <label class="lbl">Type de paiement</label>
      <select class="inp" id="compl-top">${TYPES_OP.map(t=>`<option value="${t.id}">${t.icon} ${t.label}</option>`).join('')}</select>
    </div>
    <div class="ff">
      <label class="lbl">Date du complément</label>
      <input type="date" class="inp" id="compl-date" value="${today}"/>
    </div>
    <div id="compl-bilan" style="background:var(--navy);border-radius:8px;padding:12px;margin-bottom:14px;font-size:12px;color:#8eaacf">
      Saisissez un montant…
    </div>

    <div style="display:flex;gap:8px">
      <button class="btn bs" onclick="g('m-compl').remove()">Annuler</button>
      <button class="btn bp" style="flex:1" onclick="validerComplement(${lid},${pid})">✓ Enregistrer le complément</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

function validerComplement(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  const mt = parseFloat(g('compl-mt')?.value||0);
  if(!mt||mt<=0){alert('Montant invalide.');return;}
  const typeOp = v('compl-top')||'locataire';
  const dateCompl = v('compl-date')||new Date().toISOString().slice(0,10);

  // Ajouter la ligne de complément aux lignes existantes
  p.lignes = p.lignes||[];
  p.lignes.push({rubrique:'loyer', typeOp, montant:mt, desc:'Complément '+(new Date(dateCompl)).toLocaleDateString('fr-FR')});

  const newTotal = (p.montantEncaisse||0) + mt;
  const ecart = newTotal - (p.montantAttendu||newTotal);

  p.montantEncaisse = newTotal;
  p.dette = Math.max(0, -ecart);
  p.tropPercu = Math.max(0, ecart);
  p.statut = p.dette < 0.01 ? 'payé' : 'partiel';
  p.date = dateCompl;

  // Audit : complément
  auditLog(lid, 'paiement',
    '💶 Complément de '+fmt(mt)+' € — '+moisLbl(p.mois)+(p.statut==='payé'?' (DETTE SOLDÉE)':' (reste '+fmt(p.dette)+' €)'),
    {mois:p.mois, complement:mt, nouveauTotal:newTotal, statut:p.statut}
  );
  save(); g('m-compl').remove();

  if(p.statut === 'payé') {
    showToast('✅ Dette soldée — paiement complet !', 4000);
    renderLoyers();
    setTimeout(()=>{
      if(confirm('Paiement complet ! Envoyer la quittance au locataire ?')) envQuitt(lid,pid);
    }, 300);
  } else {
    showToast('💶 Complément enregistré — reste '+fmt(p.dette)+' € de dette', 4000);
    renderLoyers();
  }
}

// ── CORRIGER UN ENCAISSEMENT (saisie erronée) ─────────────────────────────────
function corrigerPaiement(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  // Montant encaissé = source de vérité (mis à jour à chaque complément)
  const total = (p.montantEncaisse !== undefined && p.montantEncaisse !== null && p.montantEncaisse > 0)
    ? p.montantEncaisse
    : ((p.lignes||[]).reduce((s,li)=>s+li.montant,0)||(p.montant+p.charges));
  const estPartiel = p.statut==='partiel';
  // Loyer appelé = montantAttendu (fixé à la création de l'appel, jamais modifié)
  const attenduVoir = p.montantAttendu || ((p.lignes||[]).filter(li=>!(li.desc&&li.desc.indexOf('Complément')===0)).reduce((s,li)=>s+(li.montant||0),0)) || total;
  const m = document.createElement('div'); m.className='modal-bg'; m.id='m-corr';
  m.innerHTML = `<div class="modal-box">
    <div class="mhdr">
      <span class="mtitle">✏️ Corriger l'encaissement</span>
      <button class="mclose" onclick="g('m-corr').remove()">×</button>
    </div>
    ${al('i','Choisissez comment corriger cet encaissement.')}
    <div style="font-size:14px;font-weight:600;color:var(--tx);margin:12px 0 6px">
      ${moisLbl(p.mois)} — ${fmt(total)} € encaissés
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">

      <!-- Option 1 : Re-ouvrir le formulaire d'encaissement -->
      <div class="card tap" style="cursor:pointer;border:2px solid var(--acc)" onclick="g('m-corr').remove();reencaisser(${lid},${pid})">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px;flex-shrink:0">✏️</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--acc)">Modifier les montants</div>
            <div style="font-size:12px;color:var(--tx2);margin-top:2px">Rouvrir le formulaire avec les valeurs actuelles et les corriger</div>
          </div>
        </div>
      </div>

      <!-- Option 2 : Ajouter un complément -->
      <div class="card tap" style="cursor:pointer;border:2px solid var(--grn)" onclick="g('m-corr').remove();completerPaiement(${lid},${pid})">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px;flex-shrink:0">💶</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--grn)">Ajouter un complément</div>
            <div style="font-size:12px;color:var(--tx2);margin-top:2px">Enregistrer un versement supplémentaire pour solder la dette</div>
          </div>
        </div>
      </div>

      <!-- Option 3 : Annuler et remettre en impayé -->
      <div class="card tap" style="cursor:pointer;border:2px solid var(--red)" onclick="g('m-corr').remove();annulerEncaissement(${lid},${pid})">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px;flex-shrink:0">↩️</span>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--red)">Annuler l'encaissement</div>
            <div style="font-size:12px;color:var(--tx2);margin-top:2px">Remettre le mois en statut "Impayé" pour tout recommencer</div>
          </div>
        </div>
      </div>

    </div>
    <button class="btn bs bfull" style="margin-top:12px" onclick="g('m-corr').remove()">Fermer</button>
  </div>`;
  document.body.appendChild(m);
}

function reencaisser(lid, pid) {
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  // Snapshot de l'état actuel (pas de mutation du statut)
  window._encBackup = {
    lid, pid,
    backup: {
      statut:p.statut, montant:p.montant, charges:p.charges,
      lignes:JSON.parse(JSON.stringify(p.lignes||[])),
      montantAttendu:p.montantAttendu, montantEncaisse:p.montantEncaisse,
      dette:p.dette, tropPercu:p.tropPercu, date:p.date
    }
  };
  // Ouvrir showEncaisser en mode correction (statut forcé 'appel' uniquement dans la modal)
  p._modeCorrection = true;
  const statOriginal = p.statut;
  p.statut = 'appel';
  showEncaisser(lid, pid);
  // Bouton annuler → restaure l'état original
  const modal = document.getElementById('m-enc');
  if(modal){
    const closeBtn = modal.querySelector('.mclose');
    const cancelBtn = modal.querySelector('#enc-cancel-btn');
    function restaurer(){
      const bk = window._encBackup;
      if(bk && bk.pid===pid){
        const ll=DB.logements.find(x=>x.id===bk.lid);
        const pp=(ll&&ll.paiements||[]).find(x=>x.id===bk.pid);
        if(pp){ Object.assign(pp, bk.backup); delete pp._modeCorrection; }
        delete window._encBackup;
      }
      const m=document.getElementById('m-enc'); if(m)m.remove();
      renderLoyers();
    }
    if(closeBtn){ closeBtn.onclick = restaurer; closeBtn.ontouchend = (ev)=>{ ev.preventDefault(); restaurer(); }; }
    if(cancelBtn){ cancelBtn.onclick = restaurer; cancelBtn.ontouchend = (ev)=>{ ev.preventDefault(); restaurer(); }; }
  }
}

function annulerEncaissement(lid, pid) {
  if(!confirm('Annuler cet encaissement et remettre le mois en impaye ?')) return;
  const l = DB.logements.find(x=>x.id===lid);
  const p = (l.paiements||[]).find(x=>x.id===pid); if(!p)return;
  p.statut = 'impayé';
  p.date = null;
  p.quittance = false;
  p.dette = 0;
  p.tropPercu = 0;
  p.montantEncaisse = 0;
  p.montantAttendu = 0;
  delete p._backup;
  // Garder les lignes de l'appel (rubrique/montants attendus)
  if(p.lignes && p.lignes.length) {
    // Remettre aux montants attendus
    p.lignes.forEach(li => { if(li._montantAttendu) li.montant = li._montantAttendu; });
  }
  // Audit : annulation
  auditLog(lid, 'paiement',
    '↩️ Annulation encaissement — '+moisLbl(p.mois),
    {mois:p.mois}
  );
  save();
  showToast('↩️ Encaissement annulé — mois remis en impayé', 3500);
  renderLoyers();
}


function majBilanComplement(val, dette, enc, attendu) {
  var mt=parseFloat(val)||0;
  var newTotal=enc+mt, ecart=newTotal-attendu;
  var bilan=document.getElementById('compl-bilan'); if(!bilan)return;
  if(Math.abs(ecart)<0.01) bilan.innerHTML='<span style="color:#4ade80">✓ Paiement complet — dette soldée</span>';
  else if(ecart<0) bilan.innerHTML='<span style="color:#fca5a5">Reste encore '+(attendu-newTotal).toFixed(2)+' € de dette</span>';
  else bilan.innerHTML='<span style="color:#4ade80">Trop-perçu de '+ecart.toFixed(2)+' €</span>';
}

    go('tableau');
  }
}
